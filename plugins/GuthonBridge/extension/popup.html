<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Guthon Bridge</title>
    <link rel="stylesheet" href="bridge.css" />
  </head>
  <body class="guthon-bridge-popup">
    <div class="wrap">
      <div class="head">
        <div class="title">Guthon Bridge</div>
        <button id="closeBtn" title="关闭" type="button">×</button>
      </div>

      <details>
        <summary>Bridge 配对设置</summary>
        <p>先在 Nexus 启动 Bridge，点击“复制配对令牌”，在此粘贴。</p>
        <label>配对令牌<input id="bridgeToken" type="password" autocomplete="off" /></label>
        <label>本机端口<input id="bridgePort" type="number" value="17361" min="1" max="65535" /></label>
        <button id="pairBridgeBtn" type="button">保存并连接</button>
        <button id="resumeBridgeJobsBtn" type="button">查询待恢复任务</button>
      </details>
      <label>
        <span id="procedureLabel">包名</span>
        <input id="procedureKeyword" value="" readonly />
      </label>

      <details>
        <summary class="recent-pulls-heading"><span>最近拉取对象</span><button id="refreshRecentPullsBtn" type="button" title="刷新历史" aria-label="刷新历史"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg></button></summary>
        <div id="recentPulls"></div>
      </details>

      <label>
        <span id="funIdLabel">函数名</span>
        <input id="funId" value="" readonly />
      </label>

      <label>
        页面导出目录
        <input id="outputDir" value="" readonly placeholder="连接 Bridge 后显示导出目录" />
      </label>

      <div class="actions">
        <div class="source-actions">
          <button id="pullHubBtn">拉取源码表版本</button>
          <button id="forceRefreshBtn" class="action-force">强制刷新</button>
        </div>
        <button id="copyFieldsBtn">复制字段</button>
        <button id="pasteFieldsBtn">粘贴字段</button>
        <button id="locateNexusBtn" class="action-nexus" type="button" hidden><span class="action-nexus-icon" aria-hidden="true">↗</span><span class="action-nexus-label">在 Nexus 中定位</span></button>
      </div>

      <div id="status">准备就绪</div>
      <button id="pullPageBtn" class="action-secondary" type="button">拉取页面当前源码</button>
    </div>

    <script src="host-settings.js"></script>
    <script src="host-config.js"></script>
    <script src="nexus-locator.js"></script>
    <script src="workspace-selection.js"></script>
    <script src="task-client.js"></script>
    <script src="task-history.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
