<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Guthon Bridge</title>
    <link rel="stylesheet" href="bridge.css" />
  </head>
  <body class="guthon-bridge-popup">
    <div class="wrap">
      <div class="head">
        <div class="title">Guthon Bridge</div>
        <button id="closeBtn" title="关闭" type="button">×</button>
      </div>

      <details class="popup-section pairing-settings" open>
        <summary>Bridge 配对设置</summary>
        <div class="section-content">
            <p>在 Nexus 启动 Bridge，复制配对令牌后粘贴到这里。</p>
            <label>配对令牌<input id="bridgeToken" type="text" autocomplete="off" spellcheck="false" /></label>
            <div class="pairing-actions">
                <label>本机端口<input id="bridgePort" type="number" value="17361" min="1" max="65535" /></label>
                <button id="pairBridgeBtn" type="button">保存并连接</button>
                <button id="resumeBridgeJobsBtn" class="action-secondary" type="button">查询待恢复任务</button>
            </div>
        </div>
      </details>

      <div class="field-actions">
        <div id="fieldActions" class="field-action-row" role="group" aria-labelledby="fieldTransferLabel" hidden>
            <span id="fieldTransferLabel">字段平移</span>
            <div class="field-action-buttons">
                <button id="copyFieldsBtn" type="button">复制字段</button>
                <button id="pasteFieldsBtn" type="button">粘贴字段</button>
            </div>
        </div>
        <div id="ideActions" class="field-action-row" role="group" aria-labelledby="ideActionsLabel" hidden>
            <span id="ideActionsLabel">IDE联动</span>
            <div class="field-action-buttons">
                <button id="localFieldsBtn" type="button" hidden>粘贴本地改动</button>
                <button id="locateNexusBtn" type="button" hidden>定位本地源码</button>
            </div>
        </div>
      </div>
      <details class="popup-section source-tools">
        <summary>源码刷新与导出</summary>
        <div class="section-content">
            <div class="source-actions">
                <button id="pullHubBtn" class="action-secondary" type="button" hidden>刷新当前对象</button>
                <button id="pullPageBtn" class="action-secondary" type="button" hidden>导出当前源码</button>
            </div>
            <div class="source-identity" hidden>
                <label><span id="procedureLabel">包名</span><input id="procedureKeyword" readonly /></label>
                <label><span id="funIdLabel">函数名</span><input id="funId" readonly /></label>
            </div>
            <label hidden>导出目录<input id="outputDir" readonly placeholder="连接后显示导出目录" /></label>
            <details class="recent-pulls">
                <summary>最近拉取对象</summary>
                <button id="refreshRecentPullsBtn" type="button">刷新历史</button>
                <div id="recentPulls"></div>
            </details>
        </div>
      </details>
      <div id="status" role="status">准备就绪</div>
    </div>

    <script src="host-settings.js"></script>
    <script src="host-config.js"></script>
    <script src="nexus-locator.js"></script>
    <script src="workspace-selection.js"></script>
    <script src="task-client.js"></script>
    <script src="refresh-target.js"></script>
    <script src="task-history.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
