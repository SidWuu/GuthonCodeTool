name: Build Release

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "config/example/**"
      - "plugins/GuthonBridge/**"
      - "plugins/GuthonSvnVSCodeExtension/**"
      - "plugins/GuthonVSCodeExtension/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-app:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build]')
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: GuthonCodeTool-windows
            asset: GuthonCodeTool-windows-x64.exe
          - os: macos-15
            artifact: GuthonCodeTool-macos
            asset: GuthonCodeTool-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install pyinstaller pymysql

      - name: Build application
        run: python scripts/build_guthon_tool.py

      - name: Test packaged application
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/GuthonCodeTool.exe self-test --home "$RUNNER_TEMP/guthon-self-test"
          else
            ./dist/GuthonCodeTool self-test --home "$RUNNER_TEMP/guthon-self-test"
          fi

      - name: Prepare Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/GuthonCodeTool.exe "${{ matrix.asset }}"

      - name: Prepare macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/GuthonCodeTool "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  build-plugins:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test and package Guthon Nexus
        working-directory: plugins/GuthonVSCodeExtension/gushen-vscode-completion
        run: |
          npm test
          npm run check
          npm run build:bridge
          npx --yes @vscode/vsce@3.9.2 package \
            --allow-missing-repository \
            --skip-license \
            --out ../../../guthon-nexus-vscode.vsix

      - name: Test and package Guthon SVN Navigator
        working-directory: plugins/GuthonSvnVSCodeExtension/guthon-svn-navigator
        run: |
          npm test
          npm run check
          npx --yes @vscode/vsce@3.9.2 package \
            --no-dependencies \
            --skip-license \
            --out ../../../guthon-svn-navigator-vscode.vsix

      - name: Prepare Release VSIX names
        run: mv guthon-nexus-vscode.vsix guthon-nexus-all-in-one-vscode.vsix

      - name: Test Bridge
        working-directory: plugins/GuthonBridge
        run: npm test

      - name: Package Bridge browser extension
        working-directory: plugins/GuthonBridge
        run: |
          node -e 'const fs=require("fs"); const p=require("./extension/manifest.json"); p.version=`0.1.${process.env.GITHUB_RUN_NUMBER}`; fs.writeFileSync("extension/manifest.json", JSON.stringify(p, null, 2) + "\n")'
          zip -r ../../GuthonCodeTool-chrome.zip extension -x "*.DS_Store" "*.test.js"

      - uses: actions/upload-artifact@v7
        with:
          name: release-plugins
          path: |
            guthon-nexus-all-in-one-vscode.vsix
            guthon-svn-navigator-vscode.vsix
            GuthonCodeTool-chrome.zip
          if-no-files-found: error

  release:
    needs:
      - build-app
      - build-plugins
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify release assets
        run: |
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 5
          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Generate Chinese release notes
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
            --jq .commit.message > commit-notes.md
          sed -i -E \
            -e '1s/^\[build\][[:space:]]*//' \
            -e '/^[[:space:]]*\[build\][[:space:]]*$/d' \
            commit-notes.md
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > generated-notes.md
          sed -i \
            -e 's/^## What'\''s Changed$/## GitHub 自动汇总/' \
            -e 's/^## New Contributors$/## 新贡献者/' \
            -e 's/^\*\*Full Changelog\*\*:/\*\*完整变更记录\*\*:/' \
            generated-notes.md
          {
            echo "本版本由 main 分支自动构建并发布。"
            echo
            echo "## 下载内容"
            echo
            echo "- Windows x64 应用：\`GuthonCodeTool-windows-x64.exe\`"
            echo "- macOS M1 及后续型号应用：\`GuthonCodeTool-macos-arm64.zip\`"
            echo "- Guthon Nexus All-in-One（DATABASE/SVN 双模式）：\`guthon-nexus-all-in-one-vscode.vsix\`"
            echo "- Guthon SVN Navigator（仅 SVN）：\`guthon-svn-navigator-vscode.vsix\`"
            echo "- Guthon Bridge：\`GuthonCodeTool-chrome.zip\`"
            echo
            echo "## 本次变更"
            echo
            cat commit-notes.md
            echo
            cat generated-notes.md
          } > release-notes.md

      - name: Create GitHub Release
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GuthonCodeTool $RELEASE_TAG" \
            --notes-file release-notes.md \
            --latest

      - name: 创建 Gitee Release
        id: gitee-release
        env:
          GITEE_TOKEN: ${{ secrets.SYNCRELEASETOGITEE }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          test -n "$GITEE_TOKEN" || { echo "::error::缺少 Secret SYNCRELEASETOGITEE"; exit 1; }
          test -n "$GITEE_OWNER" || { echo "::error::缺少变量 GITEE_OWNER"; exit 1; }
          test -n "$GITEE_REPO" || { echo "::error::缺少变量 GITEE_REPO"; exit 1; }

          response=$(curl --fail-with-body --silent --show-error \
            -X POST \
            -F "access_token=$GITEE_TOKEN" \
            -F "tag_name=$RELEASE_TAG" \
            -F "target_commitish=main" \
            -F "name=GuthonCodeTool $RELEASE_TAG" \
            -F "body=<release-notes.md" \
            "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases")

          release_id=$(echo "$response" | jq -er '.id')
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: 上传 Gitee Release 附件
        env:
          GITEE_TOKEN: ${{ secrets.SYNCRELEASETOGITEE }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          GITEE_RELEASE_ID: ${{ steps.gitee-release.outputs.release_id }}
        run: |
          for file in release/*; do
            curl --fail-with-body --silent --show-error \
              -X POST \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$file" \
              "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$GITEE_RELEASE_ID/attach_files"
          done
