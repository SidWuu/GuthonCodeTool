name: Build Release

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "scripts/**"
      - "config/example/**"
      - "plugins/GuthonBridge/**"
      - "plugins/GuthonNexus/**"
      - "docs/releases/**"
      - ".github/scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-script:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and test Python zipapp
        run: |
          python scripts/build_script_tool.py --output GuthonCodeTool-python.pyz
          python GuthonCodeTool-python.pyz version
          python GuthonCodeTool-python.pyz self-test --home "$RUNNER_TEMP/guthon-script-self-test"
          python scripts/check_toolhost.py python GuthonCodeTool-python.pyz
          python scripts/check_release_smoke.py --entry GuthonCodeTool-python.pyz
          cp scripts/python-requirements.txt GuthonCodeTool-python-requirements.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-script
          path: |
            GuthonCodeTool-python.pyz
            GuthonCodeTool-python-requirements.txt
          if-no-files-found: error

  build-app:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build]')
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: GuthonCodeTool-windows
            asset: GuthonCodeTool-windows-x64.exe
          - os: macos-15
            artifact: GuthonCodeTool-macos
            asset: GuthonCodeTool-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    needs: build-script
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install pyinstaller -r scripts/python-requirements.txt

      - uses: actions/download-artifact@v7
        with:
          name: release-script

      - name: Test shared Python zipapp on target platform
        shell: bash
        run: |
          python GuthonCodeTool-python.pyz self-test --home "$RUNNER_TEMP/guthon-script-self-test"
          python scripts/check_toolhost.py python GuthonCodeTool-python.pyz
          python scripts/check_release_smoke.py --entry GuthonCodeTool-python.pyz

      - name: Build application
        run: python scripts/build_guthon_tool.py

      - name: Test packaged application
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/GuthonCodeTool.exe self-test --home "$RUNNER_TEMP/guthon-self-test"
            python scripts/check_toolhost.py ./dist/GuthonCodeTool.exe
            python scripts/check_release_smoke.py --entry dist/GuthonCodeTool.exe
          else
            ./dist/GuthonCodeTool/GuthonCodeTool self-test --home "$RUNNER_TEMP/guthon-self-test"
            python scripts/check_toolhost.py ./dist/GuthonCodeTool/GuthonCodeTool
            python scripts/check_release_smoke.py --entry dist/GuthonCodeTool/GuthonCodeTool
          fi

      - name: Prepare Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/GuthonCodeTool.exe "${{ matrix.asset }}"

      - name: Prepare macOS application
        if: runner.os == 'macOS'
        run: |
          # onedir layout: the archive root holds the launcher plus its _internal runtime.
          (cd dist && ditto --norsrc -c -k GuthonCodeTool "$GITHUB_WORKSPACE/${{ matrix.asset }}")
          entries=$(unzip -Z -1 "${{ matrix.asset }}")
          grep -qx 'GuthonCodeTool' <<< "$entries"
          grep -q '^_internal/' <<< "$entries"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  build-plugins:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test and package Guthon Nexus
        working-directory: plugins/GuthonNexus/gushen-vscode-completion
        run: |
          release_version=$(tr -d '[:space:]' < ../../../VERSION)
          printf '{\n  "version": "%s"\n}\n' "$release_version" > tool-version.json
          npm test
          npm run check
          npm run build:bridge
          node ../../../scripts/check_nexus_commands.mjs
          git diff --exit-code -- bridge/server.js bridge/page-context.js bridge/browser-updates.js data/tool-command-metadata.json
          npx --yes @vscode/vsce@3.9.2 package \
            --allow-missing-repository \
            --skip-license \
            --out ../../../guthon-nexus-vscode.vsix

      - name: Test Bridge
        working-directory: plugins/GuthonBridge
        run: npm test

      - name: Package Bridge browser extension
        working-directory: plugins/GuthonBridge
        run: |
          release_version=$(tr -d '[:space:]' < ../../VERSION)
          RELEASE_VERSION="$release_version" node -e 'const fs=require("fs"); const p=require("./extension/manifest.json"); p.version=process.env.RELEASE_VERSION; fs.writeFileSync("extension/manifest.json", JSON.stringify(p, null, 2) + "\n")'
          zip -r ../../GuthonCodeTool-chrome.zip extension -x "*.DS_Store" "*.test.js"

      - name: Package Guthon Testing Skill
        working-directory: skills
        run: zip -r ../guthon-testing.zip guthon-testing -x "*.DS_Store"

      - uses: actions/upload-artifact@v7
        with:
          name: release-plugins
          path: |
            guthon-nexus-vscode.vsix
            GuthonCodeTool-chrome.zip
            guthon-testing.zip
          if-no-files-found: error

  release:
    needs:
      - build-app
      - build-script
      - build-plugins
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release version
        run: |
          release_version=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must contain a semantic version such as 0.2.0"
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$release_version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify release assets
        run: |
          expected=(
            GuthonCodeTool-windows-x64.exe
            GuthonCodeTool-macos-arm64.zip
            GuthonCodeTool-python.pyz
            GuthonCodeTool-python-requirements.txt
            GuthonCodeTool-chrome.zip
            guthon-nexus-vscode.vsix
            guthon-testing.zip
          )
          for name in "${expected[@]}"; do
            test -f "release/$name" || { echo "::error::缺少发行附件 $name"; exit 1; }
          done
          actual=$(find release -maxdepth 1 -type f | wc -l)
          test "$actual" -eq "${#expected[@]}" || {
            echo "::error::发行附件数量为 $actual，期望 ${#expected[@]}"
            find release -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          }
          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Generate component release catalog
        run: node scripts/build_release_catalog.mjs --release-dir release --version "$RELEASE_VERSION"

      - name: Generate application checksums
        working-directory: release
        run: |
          sha256sum \
            GuthonCodeTool-windows-x64.exe \
            GuthonCodeTool-macos-arm64.zip \
            GuthonCodeTool-python.pyz \
            GuthonCodeTool-python-requirements.txt \
            GuthonCodeTool-chrome.zip \
            guthon-nexus-vscode.vsix \
            guthon-testing.zip \
            GuthonCodeTool-release.json \
            > GuthonCodeTool-checksums.txt

      - name: Sign release checksum metadata when an external key is configured
        env:
          GUTHON_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.GUTHON_RELEASE_SIGNING_PRIVATE_KEY }}
          GUTHON_RELEASE_SIGNING_KEY_ID: ${{ vars.GUTHON_RELEASE_SIGNING_KEY_ID }}
        run: |
          if [ -n "$GUTHON_RELEASE_SIGNING_PRIVATE_KEY" ]; then
            node scripts/sign_release.mjs --checksums release/GuthonCodeTool-checksums.txt --version "$RELEASE_VERSION" --out release/GuthonCodeTool-checksums.signature.json
            node scripts/verify_release.mjs --release-dir release --trust-file plugins/GuthonNexus/gushen-vscode-completion/data/release-trust.json --version "$RELEASE_VERSION"
          else
            node -e 'const fs=require("fs"); const p="plugins/GuthonNexus/gushen-vscode-completion/data/release-trust.json"; if(fs.existsSync(p) && JSON.parse(fs.readFileSync(p,"utf8")).requireSignature) { console.error("Pinned signature policy requires the CI signing Secret");process.exit(1); }'
            echo "::notice::Independent release signing is not configured; no signature claim will be made."
          fi

      - name: Generate Chinese release notes
        run: |
          version_notes="docs/releases/$RELEASE_TAG.md"
          if [ -f "$version_notes" ]; then
            cp "$version_notes" release-notes.md
            exit 0
          fi

          git log -1 --format=%B "$GITHUB_SHA" > commit-notes.md
          sed -i -E \
            -e '1s/^\[build\][[:space:]]*//' \
            -e '/^[[:space:]]*\[build\][[:space:]]*$/d' \
            commit-notes.md
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > generated-notes.md || [ ! -s generated-notes.md ]; then
            echo "::warning::GitHub 自动发布说明不可用，继续使用提交说明"
            : > generated-notes.md
          fi
          sed -i \
            -e 's/^## What'\''s Changed$/## GitHub 自动汇总/' \
            -e 's/^## New Contributors$/## 新贡献者/' \
            -e 's/^\*\*Full Changelog\*\*:/\*\*完整变更记录\*\*:/' \
            generated-notes.md
          {
            echo "本版本由 main 分支自动构建并发布。"
            echo
            echo "## 下载内容"
            echo
            echo "- Windows x64 应用：\`GuthonCodeTool-windows-x64.exe\`"
            echo "- macOS M1 及后续型号应用：\`GuthonCodeTool-macos-arm64.zip\`"
            echo "- Python 调试脚本：\`GuthonCodeTool-python.pyz\`（需自备符合要求的 Python 环境）"
            echo "- Python 调试依赖：\`GuthonCodeTool-python-requirements.txt\`"
            echo "- Guthon Nexus（DATABASE/SVN 双模式）：\`guthon-nexus-vscode.vsix\`"
            echo "- Guthon Bridge：\`GuthonCodeTool-chrome.zip\`"
            echo "- Guthon Testing Skill：\`guthon-testing.zip\`（解压到 Codex Skills 目录）"
            echo "- 应用自动更新校验：\`GuthonCodeTool-checksums.txt\`"
            echo
            echo "## 本次变更"
            echo
            cat commit-notes.md
            echo
            cat generated-notes.md
          } > release-notes.md

      - name: Create or update GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG 已存在，更新说明并补齐附件"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "GuthonCodeTool $RELEASE_TAG" \
              --notes-file release-notes.md \
              --latest
            gh release upload "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GuthonCodeTool $RELEASE_TAG" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: 同步 Gitee Release 附件
        env:
          GITEE_TOKEN: ${{ secrets.SYNCRELEASETOGITEE }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          ASSET_DIR: release
          RELEASE_NOTES_FILE: release-notes.md
        run: |
          test -n "$GITEE_TOKEN" || { echo "::error::缺少 Secret SYNCRELEASETOGITEE"; exit 1; }
          test -n "$GITEE_OWNER" || { echo "::error::缺少变量 GITEE_OWNER"; exit 1; }
          test -n "$GITEE_REPO" || { echo "::error::缺少变量 GITEE_REPO"; exit 1; }
          bash .github/scripts/sync_gitee_release.sh
