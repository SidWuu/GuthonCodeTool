name: Sync Gitee Release

# 备用手动镜像同步。日常优先使用维护者本机，避免 GitHub 托管节点到 Gitee 的慢链路。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的签名发行标签，例如 v0.3.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitee-release-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify and mirror signed release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GITEE_TOKEN: ${{ secrets.SYNCRELEASETOGITEE }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          test -n "$GITEE_TOKEN" || { echo "::error::缺少 Secret SYNCRELEASETOGITEE"; exit 1; }
          test -n "$GITEE_OWNER" || { echo "::error::缺少变量 GITEE_OWNER"; exit 1; }
          test -n "$GITEE_REPO" || { echo "::error::缺少变量 GITEE_REPO"; exit 1; }
          python scripts/sync_release_to_gitee.py --tag "$INPUT_TAG" --github-repo "$GITHUB_REPOSITORY" --gitee-repo "$GITEE_OWNER/$GITEE_REPO"
