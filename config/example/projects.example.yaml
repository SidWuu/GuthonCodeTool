# 项目源码同步范围模板。
# 项目配置集合；键名组成稳定 workspaceKey：projects.<项目ID>。
projects:
  # 示例项目 ID，需在同一配置中保持唯一。
  demo-project:
    # 项目名称，用作 readonly、workcopy 和数据库快照的目录名。
    name: 示例项目
    # 源码来源不写在 YAML；Nexus 项目节点负责选择，未设置时默认 DATABASE。
    # 引用 datasource.yaml 中的数据源标识。
    datasource: demo-project-dev
    # 可选浏览器来源；为空时 Bridge 依赖数据源和系统身份匹配。
    page_origins: []
    # 当前工作区独立的子系统范围。
    systems:
      include:
        # 必须使用该项目自己的 ID，不得复制产品的数据源 ID。
        mappings:
          demo.system:
            system_id: SYS-DEMO
            data_source_id: "0001"
    # SVN 项目无需在 YAML 增加模式字段；在 Nexus 的当前项目节点选择 SVN，
    # macOS/Linux 放 svnCheckoutHere.sh，Windows 放 svnCheckoutHere.bat；两者均为正式支持格式。
    # 以下 svn 块仅用于覆盖 checkout 根、共享凭据环境变量名或 capability：
    # svn:
    #   update_policy: manual
    #   no_auth_cache: true
    #   username_env: GUTHON_NEXUS_SVN_USERNAME
    #   password_env: GUTHON_NEXUS_SVN_PASSWORD
    #   # 仅在证书暂时无法修复时使用；异常白名单必须与精确 SHA-256 指纹同时配置。
    #   allowed_cert_failures: []
    #   certificate_pins: {}
    #   capabilities:
    #     initialize: true
    #     refresh: true
    #     status: true
    #     reindex: true
    #     browse: true
    #     edit: true
    #     history: true
    #     revert: true
    # 项目继承的产品 ID，对应 products.yaml 中的键名。
    product_id: demo-product
    # 保留项；当前实现根据 projects 分组固定判定为 PROJECT。
    source_layer: PROJECT
    # 源码包含规则。
    include:
      # true 表示包含当前项目范围内的全部支持类型源码。
      all: true
    # 保留的源码排除规则；当前同步脚本不读取。
    exclude:
      # 预留的 PAGE 别名前缀排除列表。
      page_alias_prefix: []
      # 预留的过程别名前缀排除列表。
      procedure_alias_prefix: []
    # 预留的附加查询条件；当前同步脚本不读取。
    extra_where:
      # 预留的 PAGE 附加条件。
      page: ""
      # 预留的过程函数附加条件。
      procedure: ""
