# 产品源码同步范围模板。
# 产品配置集合；键名组成稳定 workspaceKey：products.<产品ID>。
products:
  # 示例产品 ID，需在同一配置中保持唯一。
  demo-product:
    # 产品名称，用作 readonly、workcopy 和数据库快照的目录名。
    name: 示例产品
    # 源码来源不写在 YAML；Nexus 项目节点负责选择，未设置时默认 DATABASE。
    # 引用 datasource.yaml 中的数据源标识。
    datasource: demo-product-dev
    # 可选浏览器来源；为空时 Bridge 依赖数据源和系统身份匹配。
    page_origins: []
    # 当前工作区独立的子系统范围。
    systems:
      include:
        system_aliases:
          - demo.system
    # 如需 SVN，在 Nexus 的当前产品节点选择 SVN，并把谷神下载的
    # svnCheckoutHere.bat 放到该工程 context/。
    # Nexus 会生成同目录脱敏 authorized-scope.json；通常不需要 svn 配置块。
    # 以下仅用于覆盖默认 checkout 根、共享凭据环境变量名或 capability：
    # svn:
    #   update_policy: manual
    #   no_auth_cache: true
    #   username_env: GUTHON_NEXUS_SVN_USERNAME
    #   password_env: GUTHON_NEXUS_SVN_PASSWORD
    #   # 仅在已核对证书且确有需要时显式列出；默认不信任任何证书异常。
    #   allowed_cert_failures: []
    #   # 使用证书异常白名单时必须同时固定管理员独立确认的服务器证书 SHA-256 指纹。
    #   certificate_pins: {}
    #   capabilities:
    #     initialize: true
    #     refresh: true
    #     system_data_bootstrap: false
    #     status: true
    #     reindex: true
    #     workcopy: false
    #     writeback: false
    #     commit: false
    #     browse: true
    #     edit: true
    #     history: true
    #     revert: true
    # 保留项；当前实现根据 products 分组固定判定为 PRODUCT。
    source_layer: PRODUCT
    # 源码包含规则。
    include:
      # true 表示包含当前产品范围内的全部支持类型源码。
      all: true
    # 保留的源码排除规则；当前同步脚本不读取。
    exclude:
      # 预留的 PAGE 别名前缀排除列表。
      page_alias_prefix: []
      # 预留的过程别名前缀排除列表。
      procedure_alias_prefix: []
