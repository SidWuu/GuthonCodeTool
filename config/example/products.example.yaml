# 产品源码同步范围模板。
# 产品配置集合；键名组成稳定 workspaceKey：products.<产品ID>。
products:
  # 示例产品 ID，需在同一配置中保持唯一。
  demo-product:
    # 产品名称，用作 readonly、workcopy 和数据库快照的目录名。
    name: 示例产品
    # 源码来源不写在 YAML；Nexus 项目节点负责选择，未设置时默认 DATABASE。
    # 引用 datasource.yaml 中的数据源标识。
    datasource: demo-product-dev
    # 可选浏览器来源；为空时 Bridge 依赖数据源和系统身份匹配。
    page_origins: []
    # 当前工作区独立的子系统范围。
    systems:
      include:
        mappings:
          demo.system:
            system_id: SYS-DEMO
            data_source_id: "0000"
    # 如需 SVN，在 Nexus 的当前产品节点选择 SVN；可使用“导入 SVN checkout 配置”选择
    # 谷神下载的 macOS/Linux svnCheckoutHere.sh 或 Windows svnCheckoutHere.bat，也可直接粘贴命令。
    # 一个根地址配合 scope 分类即可；systems/datasources 会从上面的 mappings 自动拼接 ID。
    # scope 省略时默认只检出 mappings 对应的 systems/datasources。
    # svn:
    #   url: "https://source.example/repo/product"
    #   scope: [skill, public, datasources, systems]
    #   update_policy: manual
    #   capabilities:
    #     initialize: true
    #     refresh: true
    #     status: true
    #     reindex: true
    #     workcopy: false
    #     writeback: false
    #     commit: false
    #     browse: true
    #     edit: true
    #     history: true
    #     revert: true
    # 保留项；当前实现根据 products 分组固定判定为 PRODUCT。
    source_layer: PRODUCT
    # 源码包含规则。
    include:
      # true 表示包含当前产品范围内的全部支持类型源码。
      all: true
    # 保留的源码排除规则；当前同步脚本不读取。
    exclude:
      # 预留的 PAGE 别名前缀排除列表。
      page_alias_prefix: []
      # 预留的过程别名前缀排除列表。
      procedure_alias_prefix: []
