# 谷神数据库测试目标映射模板；复制到私有运行目录后替换所有占位值。
schemaVersion: 1

expectedIdentities:
  demo-trade-dev:
    engine: mysql
    endpoint: "db.dev.example:3306"
    database: demo_trade
    evidenceRef: "<私有环境清单或平台配置证据>"

# Oracle 连接还需同时声明服务数据库和业务 schema：
#   engine: oracle
#   database: pdb
#   schema: DEMO_OWNER

# 可选内置只读连接；密码由 Nexus 写入系统凭据库，不写入本文件。
connections:
  projects.demo.trade-dev:
    engine: mysql
    host: db.dev.example
    port: 3306
    database: demo_trade
    username: readonly_user
    credentialRef: projects.demo.trade-dev
    connectTimeoutSeconds: 10

databaseTests:
  projects.demo:
    defaults:
      diagnosisTargetId: trade-dev
      byEnvironment:
        dev: trade-dev
    targets:
      - id: trade-dev
        # DBX 用户保留 connectionId；无 DBX 用户使用 connectionRef。二者可同时配置。
        systemId: SYS-DEMO
        dataSourceId: DS-DEMO
        connectionRef: projects.demo.trade-dev
        database: demo_trade
        # Oracle target 的 database 填服务数据库，并增加 schema: DEMO_OWNER。
        environment: dev
        access: read-only
        expectedIdentityRef: demo-trade-dev
        allowedTables:
          - DEMO_ORDER
          - DEMO_ORDER_DETAIL
        tenantScope:
          field: TENANT_ID
          evidenceRef: "<租户字段及允许值的私有证据>"

      # Nexus 的“配置数据库排查”会生成这种轻量目标；只能快速排查，不能参与正式验收计划。
      # - id: trade-test
      #   connectionRef: projects.demo.trade-test
      #   validationScope: diagnosis-only
      #   database: demo_trade_test
      #   environment: test
      #   access: read-only
      #   expectedIdentityRef: projects.demo.trade-test.identity
